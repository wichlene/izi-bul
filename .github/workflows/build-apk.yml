name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/cafe-finder-app-BofnA
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms/ 2>/dev/null | head -10
          ls $ANDROID_HOME/build-tools/ 2>/dev/null | head -5

      - name: Install SDK platform-36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" 2>/dev/null | tail -5 || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -alias izibul \
            -keypass izibul2024 \
            -keystore android-release.keystore \
            -storepass izibul2024 \
            -dname "CN=IziBul, OU=App, O=IziBul, L=Istanbul, S=Istanbul, C=TR" \
            -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null
          echo "KEYSTORE_FILE=$PWD/android-release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=izibul2024" >> $GITHUB_ENV
          echo "KEY_ALIAS=izibul" >> $GITHUB_ENV
          echo "KEY_PASSWORD=izibul2024" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --warning-mode all 2>&1 | tee /tmp/build.log

      - name: Show build errors (on failure)
        if: failure()
        run: |
          echo "=== LAST 80 LINES OF BUILD LOG ==="
          tail -80 /tmp/build.log || true

      - name: Find APK
        run: |
          echo "=== APK files found ==="
          find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: izibul-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release (on main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-${{ github.run_number }}
          name: "İzi Bul APK v1.0.${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            ## İzi Bul Android APK
            Capacitor ile oluşturuldu — Chrome/TWA değil, sistem WebView kullanır.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
