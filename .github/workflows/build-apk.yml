name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/cafe-finder-app-BofnA
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set version code from run number
        run: |
          VERSION_CODE=$GITHUB_RUN_NUMBER
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          # Inject versionCode into app.json
          sed -i "s/\"versionCode\": [0-9]*/\"versionCode\": $VERSION_CODE/" mobile/app.json
          echo "versionCode set to $VERSION_CODE"

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (generate native Android project)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Fix package declarations (Expo prebuild drops last segment)
        working-directory: mobile
        run: |
          NS=$(grep -m1 "namespace" android/app/build.gradle | sed "s/.*namespace '\(.*\)'.*/\1/")
          echo "Forcing package declaration to namespace: $NS"
          find android/app/src/main/java \( -name "MainActivity.kt" -o -name "MainApplication.kt" \) | while read f; do
            sed -i "1s/^package .*/package $NS/" "$f"
          done
          grep -rn "^package " android/app/src/main/java/

      - name: Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: Build Release APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/build.log

      - name: Show build errors (on failure)
        if: failure()
        run: tail -100 /tmp/build.log || true

      - name: Find APK
        run: find mobile/android/app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: izibul-app
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases (mobile-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Publishing $APK as release mobile-latest (build $VERSION_CODE)"
          # Delete old release so we can recreate with updated asset
          gh release delete mobile-latest --yes 2>/dev/null || true
          gh release create mobile-latest \
            --title "İzi Bul v${VERSION_CODE}" \
            --notes "${VERSION_CODE}" \
            "${APK}#izibul.apk"
          echo "✅ Release published: https://github.com/wichlene/izi-bul/releases/download/mobile-latest/izibul.apk"
