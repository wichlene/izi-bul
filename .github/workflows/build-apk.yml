name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/cafe-finder-app-BofnA
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show pre-installed Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools dir"

      - name: Install required SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-release.keystore
          else
            keytool -genkeypair \
              -alias izibul \
              -keypass izibul2024 \
              -keystore android-release.keystore \
              -storepass izibul2024 \
              -dname "CN=IziBul, OU=App, O=IziBul, L=Istanbul, S=Istanbul, C=TR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          echo "KEYSTORE_FILE=$PWD/android-release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-izibul2024}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${KEY_ALIAS:-izibul}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASSWORD:-izibul2024}" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: izibul-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (on main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-${{ github.run_number }}
          name: "İzi Bul APK v1.0.${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            ## İzi Bul Android APK
            Capacitor ile oluşturuldu — Chrome/TWA değil, sistem WebView kullanır.
            Telefonda "Bilinmeyen kaynaklardan yükle" izni açık olmalıdır.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
