name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/cafe-finder-app-BofnA
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (generate native Android project)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: Build Release APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/build.log

      - name: Show build errors (on failure)
        if: failure()
        run: tail -100 /tmp/build.log || true

      - name: Find APK
        run: find mobile/android/app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: izibul-app
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
